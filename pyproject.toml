[project]
name = "studio-copilot"
version = "0.1.0"
description = "Agentic music-production workspace: a FastAPI + Gemini agent that analyzes audio, adapts samples, builds arrangements, and tracks a production plan"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
    "librosa>=0.11.0",
    "python-multipart>=0.0.32",
    "matplotlib>=3.10.9",
]
